<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kisan AI</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#070b14">
<style>
:root{--p:#00f5d4;--bg:#070b14;--c:#111827;--b:#1f293d;--r:#ef4444;--w:#f59e0b;--g:#10b981}
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:var(--bg);color:#f9fafb;margin:0;padding-bottom:30px}
header{background:#0b1329;border-bottom:1px solid var(--b);padding:10px 12px;color:var(--p);font-weight:800;position:sticky;top:0}
.card{max-width:460px;margin:10px auto;padding:12px;border-radius:8px;background:var(--c);border:1px solid var(--b)}
.t{font-size:13px;font-weight:bold;color:var(--p);margin-bottom:8px}
.res{background:rgba(0,0,0,.4);border:1px solid var(--b);padding:8px;border-radius:6px;font-size:12px;line-height:1.5;margin-top:6px}
button,select,input{font:inherit;font-size:13px;border-radius:5px;padding:8px;border:1px solid #374151;background:#000;color:#fff;width:100%;margin:2px 0}
button{background:var(--p);color:#000;font-weight:bold;border:none;cursor:pointer}button:disabled{opacity:.5}
.row{display:flex;gap:6px}.tag{display:inline-block;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:bold;color:#000}
.g{background:var(--g)}.y{background:var(--w)}.r{background:var(--r);color:#fff}
img{width:100%;border-radius:6px;margin-top:6px}small{color:#9ca3af}
table{width:100%;font-size:11px;border-collapse:collapse}td,th{padding:3px;border-bottom:1px solid var(--b);text-align:left}
</style></head><body>
<header>🌱 KISAN AI</header>

<div class="card"><div class="t">🌦️ अभी का लाइव मौसम</div><div id="wx" class="res">लोकेशन ले रहा हूँ...</div></div>

<div class="card"><div class="t">📷 पत्ती की बीमारी (AI फोटो जांच)</div>
<select id="crop"><option value="">फसल: ऑटो पहचान</option><option>सरसों</option><option>चना</option><option>मक्का</option><option>सोयाबीन</option><option>कपास</option><option>गेहूं</option><option>टमाटर/मिर्च</option></select>
<input type="file" id="pic" accept="image/*" capture="environment">
<img id="prev" style="display:none">
<button id="scan" onclick="scanLeaf()">🔍 जांच करें</button><div id="leaf" class="res" style="display:none"></div></div>

<div class="card"><div class="t">📊 मंडी भाव (सरकारी Agmarknet डेटा)</div>
<div class="row"><select id="md"><option value="Dungarpur">डूंगरपुर</option><option value="Udaipur">उदयपुर</option><option value="Kota">कोटा</option><option value="Jaipur">जयपुर</option><option value="">पूरा राजस्थान</option></select>
<select id="mc"><option value="Soyabean">सोयाबीन</option><option value="Maize">मक्का</option><option value="Mustard">सरसों</option><option value="Bengal Gram(Gram)(Whole)">चना</option><option value="Cotton">कपास</option><option value="Wheat">गेहूं</option><option value="Cumin Seed(Jeera)">जीरा</option></select></div>
<button onclick="mandi()">भाव देखें</button><div id="mo" class="res" style="display:none"></div></div>

<div class="card"><div class="t">🛡️ दवा पंजीकरण जांच (CIB&amp;RC सूची)</div>
<input id="mq" placeholder="दवा का नाम / CIR नंबर / तकनीकी नाम">
<button onclick="med()">जांचें</button><div id="mdo" class="res" style="display:none"></div></div>
